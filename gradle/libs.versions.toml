[versions]
kotlin                          = "2.4.0"
java                            = "21"
javaCard                        = "8"
javaCardKit                     = "26.0"
javaCardApi                     = "3.0.5"
agp                             = "9.2.1"
android-compile-sdk             = "37"
android-min-sdk                 = "26"
jna                             = "5.19.1"

compose                         = "1.12.0-alpha02"
compose-material-icon-extended  = "1.7.3"

coroutines                      = "1.11.0"
kotlinxSerialization            = "1.11.0"

coreKtx                         = "1.19.0"
fragmentKtx                     = "1.8.9"
activityCompose                 = "1.13.0"
biometric                       = "1.4.0-alpha07"
securityCrypto                  = "1.1.0"

multiplatformSettings           = "1.3.0"
metro                           = "1.3.0"
aboutlibraries                  = "15.0.3"


[libraries]
compose-runtime                 = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation              = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui                      = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-animation               = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose" }
navigationevent-compose         = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version = "1.1.0" }
compose-components-resources    = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }

jna                             = { module = "net.java.dev.jna:jna", version.ref = "jna" }

compose-material3               = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icon-extended" }

kotlinx-coroutines-swing        = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-serialization-json      = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

androidx-core-ktx               = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-fragment-ktx           = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-activity-compose       = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-biometric              = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-security-crypto        = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

multiplatform-settings          = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatformSettings" }

[plugins]
kotlin-jvm                      = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-parcelize                = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-multiplatform            = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization            = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

compose                         = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-plugin-compose           = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

android-application             = { id = "com.android.application", version.ref = "agp" }
android-kmp-library             = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

about-libraries                 = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }
metro                           = { id = "dev.zacsweers.metro", version.ref = "metro" }