[package]
name = "core"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.31.1", features = ["cli"] }
gix = { version = "0.84.0", features = ["max-performance"] }
sha2 = "0.11.0"
hex = "0.4.3"
p256 = { version = "0.14.0-rc.9", features = ["ecdsa"] }
iroh = { version = "1.0.0-rc.1"}
iroh-gossip = "0.100.0"
swarm-discovery = "0.6.1"
data-encoding = "2.11.0"
tokio = { version = "1.52.3", features = ["full"] }
n0-future = "0.3.2"

jni = "0.22.4"
ndk-context = "0.1.1"

log = "0.4.32"
env_logger = "0.11.10"
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"